[package]
name = "kestrelfs-daemon"
version = "0.1.0"
edition = "2021"
description = "KestrelFS control-plane daemon (Phase 2 bootstrap: kernel<->Rust IPC bridge smoke test)"
license = "Apache-2.0"

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
redis = { version = "1", features = [
    "connection-manager",
    "tokio-rustls-comp",
] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
aws-config = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "behavior-version-latest",
] }
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "rustls",
    "behavior-version-latest",
] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
