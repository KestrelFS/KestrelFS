<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- 渐变色定义 -->
    <!-- Rust 橙 渐变 -->
    <linearGradient id="rustOrange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B83A14" />
      <stop offset="100%" stop-color="#F06535" />
    </linearGradient>

    <!-- NVMe 电光蓝 渐变 -->
    <linearGradient id="cyanCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0082C8" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- 背景暗色渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1115" />
      <stop offset="100%" stop-color="#181B22" />
    </linearGradient>

    <!-- 科技网格发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景画布（极客深钛灰） -->
  <rect width="800" height="500" rx="16" fill="url(#bgGradient)" />

  <!-- 背景微弱装饰网格 -->
  <g stroke="#262A33" stroke-width="1" opacity="0.4">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500" />
  </g>

  <!-- Logo 主体图形（整体倾斜 15 度以体现动态流线） -->
  <g transform="translate(180, 250) rotate(-15)">

    <!-- 1. 外层红隼羽翼 / 双快进箭头 (>>>) 形态 - 代表 RingBuffer 与极速数据流 -->
    <g fill="url(#rustOrange)">
      <!-- 最外侧翼展箭头 -->
      <path d="M -90 -120 L -30 -120 L 50 0 L -30 120 L -90 120 L -20 0 Z" opacity="0.4" />
      <!-- 中层翼展箭头 -->
      <path d="M -50 -120 L 10 -120 L 90 0 L 10 120 L -50 120 L 20 0 Z" opacity="0.7" />
      <!-- 主翼与鹰喙姿态 (最强穿透箭头) -->
      <path d="M -10 -120 L 50 -120 L 130 0 L 50 120 L -10 120 L 60 0 Z" filter="url(#glow)" />
    </g>

    <!-- 2. 内部嵌套物理 NVMe 闪存颗粒 & 核心数据穿透线 -->
    <!-- NVMe 芯片颗粒 (矩形阵列) -->
    <g fill="none" stroke="url(#cyanCore)" stroke-width="3" opacity="0.9">
      <rect x="-100" y="-35" width="30" height="70" rx="4" fill="#0F1115" />
      <rect x="-60" y="-35" width="30" height="70" rx="4" fill="#0F1115" />
      <rect x="-20" y="-35" width="30" height="70" rx="4" fill="#0F1115" />
      <!-- 颗粒连接金手指线段 -->
      <path d="M -100 -42 H 10 M -100 42 H 10" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4,4" />
    </g>

    <!-- 3. 数据穿透核心光束（代表内核零拷贝直达） -->
    <path d="M -140 0 L 160 0" stroke="url(#cyanCore)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
    <polygon points="175,0 155,-8 155,8" fill="#00D2FF" />

  </g>

  <!-- 右侧品牌文本文字区 -->
  <g transform="translate(420, 230)">
    <!-- Kestrel 标题 -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="2">
      Kestrel<tspan fill="#F06535">FS</tspan>
    </text>

    <!-- 架构副标题 / Tagline -->
    <text x="5" y="42" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-weight="600" font-size="16" fill="#00D2FF" letter-spacing="1.5">
      KERNEL-ACCELERATED
    </text>
    <text x="5" y="68" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-weight="400" font-size="14" fill="#8B949E" letter-spacing="1">
      Distributed Cloud-Native Storage
    </text>

    <!-- 技术标签小徽章 -->
    <g transform="translate(5, 95)">
      <!-- Rust Badge -->
      <rect x="0" y="0" width="55" height="22" rx="4" fill="#2D1913" stroke="#F06535" stroke-width="1"/>
      <text x="27" y="15" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F06535" text-anchor="middle">RUST</text>

      <!-- C/Kernel Badge -->
      <rect x="65" y="0" width="70" height="22" rx="4" fill="#0C2333" stroke="#00D2FF" stroke-width="1"/>
      <text x="100" y="15" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00D2FF" text-anchor="middle">KERNEL C</text>

      <!-- NVMe Badge -->
      <rect x="143" y="0" width="55" height="22" rx="4" fill="#1C212B" stroke="#484F58" stroke-width="1"/>
      <text x="170" y="15" font-family="sans-serif" font-size="11" font-weight="bold" fill="#8B949E" text-anchor="middle">NVMe</text>
    </g>
  </g>
</svg>
